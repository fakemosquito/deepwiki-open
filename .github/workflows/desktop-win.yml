name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build native Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: powershell -ExecutionPolicy Bypass -File scripts/build-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DeepWiki-Setup
          path: dist/desktop/*.exe
          if-no-files-found: error
