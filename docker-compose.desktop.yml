services:
  deepwiki:
    image: deepwiki-open:desktop
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepwiki-desktop
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ${DEEPWIKI_ENV_FILE}
    environment:
      - PORT=${PORT:-8001}
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:${PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${DEEPWIKI_DATA_DIR}:/root/.adalflow
      - ${DEEPWIKI_LOG_DIR}:/app/api/logs
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
