<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepWiki</title>
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img src="./icon.png" alt="DeepWiki" class="logo" />
        <div>
          <h1 id="title">DeepWiki</h1>
          <p id="subtitle" class="muted"></p>
        </div>
      </header>

      <section id="setup" class="panel hidden">
        <h2 id="setupTitle"></h2>
        <p id="setupHint" class="muted"></p>
        <label>
          <span id="labelBaseUrl"></span>
          <input id="OPENAI_BASE_URL" type="url" placeholder="https://api.openai.com/v1" autocomplete="off" />
        </label>
        <label>
          <span id="labelApiKey"></span>
          <input id="OPENAI_API_KEY" type="password" autocomplete="off" />
        </label>
        <label>
          <span id="labelModel"></span>
          <input id="OPENAI_MODEL" type="text" placeholder="gpt-4o" autocomplete="off" />
        </label>
        <label>
          <span id="labelEmbedding"></span>
          <input id="OPENAI_EMBEDDING_MODEL" type="text" placeholder="BAAI/bge-small-en-v1.5" autocomplete="off" />
        </label>
        <p id="setupStatus" class="status" hidden></p>
        <div class="actions">
          <button id="saveBtn" type="button" class="primary"></button>
        </div>
      </section>

      <section id="progress" class="panel hidden">
        <ol id="steps"></ol>
        <pre id="detail" class="log"></pre>
      </section>

      <section id="runtimeMissing" class="panel hidden">
        <h2 id="runtimeMissingTitle"></h2>
        <p id="runtimeMissingBody" class="muted"></p>
        <div class="actions">
          <button id="runtimeRetryBtn" type="button" class="ghost"></button>
        </div>
      </section>

      <section id="error" class="panel hidden">
        <h2 id="errorTitle"></h2>
        <p id="errorBody" class="muted"></p>
        <div class="actions">
          <button id="errorRetryBtn" type="button" class="primary"></button>
        </div>
      </section>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
